<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSS Sponsorship Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nss-blue: #0f204b;
            --nss-red: #d32f2f;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-dark: #2d3436;
            --border: #dfe6e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-dark);
        }

        header {
            background: var(--nss-blue);
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-circle {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            border: 2px solid var(--nss-red);
            overflow: hidden;
        }

        .logo-circle img { width: 80%; }
        .header-text h1 { font-size: 1.5rem; font-weight: 600; }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .page-toggles { display: flex; background: #f1f2f6; }
        
        .toggle-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            color: #636e72;
            transition: 0.3s;
        }

        .toggle-btn.active {
            background: white;
            color: var(--nss-blue);
            border-bottom: 3px solid var(--nss-red);
        }

        .view-section { display: none; padding: 30px; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
        }

        .progress-bar::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--border);
            z-index: 1;
            transform: translateY(-50%);
        }

        .step {
            position: relative;
            z-index: 2;
            background: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 3px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #636e72;
            transition: 0.3s;
        }

        .step.active {
            border-color: var(--nss-red);
            background: var(--nss-red);
            color: white;
        }

        .form-step { display: none; }
        .form-step.active { display: block; animation: slideIn 0.3s ease; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        
        .input-group { margin-bottom: 15px; }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--nss-blue);
        }

        input[type="text"], input[type="date"], input[type="tel"], 
        input[type="email"], input[type="number"], input[type="url"], 
        input[type="password"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--nss-blue);
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        .consent-box {
            background: #f8f9fa;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
        
        .consent-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-prev { background: #e0e0e0; color: #333; }
        .btn-next, .btn-submit { background: var(--nss-blue); color: white; }
        .btn-next:hover, .btn-submit:hover { background: var(--nss-red); }
        .full-width { width: 100%; }

    </style>
</head>
<body>

    <header>
        <div class="logo-circle">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/NSS_logo.png/600px-NSS_logo.png" alt="NSS Logo">
        </div>
        <div class="header-text">
            <h1>NSS Sponsorship Portal</h1>
        </div>
    </header>

    <div class="container">
        <div class="card">
            
            <div class="page-toggles">
                <button class="toggle-btn active" onclick="switchMainView('login')">Login</button>
                <button class="toggle-btn" onclick="switchMainView('register')">Registration Form</button>
            </div>

            <!-- LOGIN PAGE -->
            <div id="login-view" class="view-section active">
                <h2 style="text-align: center; color: var(--nss-blue); margin-bottom: 20px;">Portal Login</h2>
                <form action="/api/login" method="POST">
                    <div class="input-group">
                        <label>Registered Email / Mobile Number</label>
                        <input type="text" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" required>
                    </div>
                    <div style="text-align: right; margin-bottom: 20px;">
                        <a href="#" style="font-size: 0.85rem; color: var(--nss-red);">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-submit full-width">Login</button>
                </form>
            </div>

            <!-- REGISTRATION FORM -->
            <div id="register-view" class="view-section">
                
                <div class="progress-bar">
                    <div class="step active" id="indicator-1">1</div>
                    <div class="step" id="indicator-2">2</div>
                    <div class="step" id="indicator-3">3</div>
                </div>

                <form action="/api/register" method="POST" enctype="multipart/form-data">
                    
                    <!-- STEP 1: Personal Details -->
                    <div class="form-step active" id="step-1">
                        <h3 style="color: var(--nss-blue); border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px;">Personal Details</h3>
                        <div class="grid-2">
                            <div class="input-group"><label>Full Name</label><input type="text" required></div>
                            <div class="input-group"><label>Date of Birth</label><input type="date" required></div>
                            <div class="input-group">
                                <label>Gender</label>
                                <select><option>Male</option><option>Female</option><option>Other</option></select>
                            </div>
                            <div class="input-group"><label>Mobile Number</label><input type="tel" required></div>
                            <div class="input-group"><label>Email Address</label><input type="email" required></div>
                        </div>
                        <div class="grid-2">
                            <div class="input-group"><label>Current City</label><input type="text" required></div>
                            <div class="input-group"><label>State</label><input type="text" required></div>
                        </div>
                        <div class="btn-group">
                            <div></div>
                            <button type="button" class="btn btn-next" onclick="changeStep(1)">Next ➔</button>
                        </div>
                    </div>

                    <!-- STEP 2: NSS Details -->
                    <div class="form-step" id="step-2">
                        <h3 style="color: var(--nss-blue); border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px;">NSS Details</h3>
                        <div class="grid-2">
                            <div class="input-group"><label>College/Institution Name</label><input type="text" required></div>
                            <div class="input-group"><label>University</label><input type="text" required></div>
                            <div class="input-group"><label>NSS Unit Number</label><input type="text" required></div>
                            <div class="input-group"><label>NSS Registration/Volunteer ID</label><input type="text" required></div>
                        </div>
                        <div class="grid-3">
                            <div class="input-group"><label>Year joined NSS</label><input type="number" required></div>
                            <div class="input-group"><label>Year completed NSS</label><input type="number" required></div>
                            <div class="input-group"><label>Years as NSS volunteer</label><input type="number" required></div>
                        </div>
                        
                        <div class="input-group">
                            <label>NSS certificate Available?</label>
                            <div class="radio-group">
                                <label><input type="radio" name="cert_avail" value="yes"> Yes</label>
                                <label><input type="radio" name="cert_avail" value="no"> No</label>
                            </div>
                        </div>

                        <div class="input-group">
                            <label>Major NSS Activities participated in</label>
                            <textarea rows="2"></textarea>
                        </div>
                        <div class="input-group">
                            <label>NSS Achievements/Awards</label>
                            <textarea rows="2"></textarea>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-prev" onclick="changeStep(-1)">⬅ Previous</button>
                            <button type="button" class="btn btn-next" onclick="changeStep(1)">Next ➔</button>
                        </div>
                    </div>

                    <!-- STEP 3: Professional & Verification -->
                    <div class="form-step" id="step-3">
                        <h3 style="color: var(--nss-blue); border-bottom: 2px solid #eee; padding-bottom: 5px; margin-bottom: 15px;">Current Professional Details</h3>
                        <div class="grid-2">
                            <div class="input-group"><label>Current Occupation</label><input type="text" required></div>
                            <div class="input-group"><label>Current Designation</label><input type="text" required></div>
                            <div class="input-group"><label>Organization/Company Name</label><input type="text" required></div>
                            <div class="input-group"><label>Industry/Field</label><input type="text" required></div>
                            <div class="input-group"><label>Work Location</label><input type="text" required></div>
                            <div class="input-group"><label>LinkedIn Profile Link (Optional)</label><input type="url"></div>
                        </div>

                        <h3 style="color: var(--nss-blue); border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 15px; margin-bottom: 15px;">Alumni Participation</h3>
                        <div class="checkbox-group">
                            <label><input type="checkbox"> Sponsorship</label>
                            <label><input type="checkbox"> Mentoring</label>
                            <label><input type="checkbox"> Guest Lectures</label>
                            <label><input type="checkbox"> Networking</label>
                        </div>

                        <h3 style="color: var(--nss-blue); border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 20px; margin-bottom: 10px;">Verification & Consent</h3>
                        
                        <div class="input-group">
                            <label>Upload NSS Certificate (Optional)</label>
                            <input type="file" accept=".pdf,.jpg,.jpeg,.png">
                        </div>

                        <div class="consent-box">
                            <div class="consent-item">
                                <input type="checkbox" required id="confirm1">
                                <label for="confirm1" style="color: black;">I confirm that the information provided is correct</label>
                            </div>
                            <div class="consent-item">
                                <input type="checkbox" required id="confirm2">
                                <label for="confirm2" style="color: black;">I agree to be contacted by the NSS unit regarding alumni activities and Sponsorship opportunities.</label>
                            </div>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-prev" onclick="changeStep(-1)">⬅ Previous</button>
                            <button type="submit" class="btn btn-submit">Submit Form</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script>
        // Toggles between Login and Registration views
        function switchMainView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId + '-view').classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Handles the Next/Previous buttons in the registration form
        let currentStep = 1;
        function changeStep(direction) {
            let steps = document.querySelectorAll('.form-step');
            let indicators = document.querySelectorAll('.step');
            
            steps[currentStep - 1].classList.remove('active');
            currentStep += direction;
            steps[currentStep - 1].classList.add('active');
            
            indicators.forEach((ind, index) => {
                if (index < currentStep) ind.classList.add('active');
                else ind.classList.remove('active');
            });
        }

        // Intercepts the Login Form with mock credentials and saves the name
        const loginForm = document.querySelector('#login-view form');

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const emailInput = this.querySelector('input[type="text"]').value;
            const passInput = this.querySelector('input[type="password"]').value;

            if (emailInput === "chidek" && passInput === "pattanaik") {
                // Save the user's name to the browser's local storage
                localStorage.setItem("loggedInName", "Chidek");
                window.location.href = "profile.html";
            } else {
                alert("Invalid credentials! For testing, use Email: chidek | Password: pattanaik");
            }
        });
    </script>
</body>
</html>
